name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned sherpa-onnx revision. The sys crate's allowlist is the contract; when
  # this moves, re-check that every name in sherpa-onnx-sys/build.rs still exists.
  SHERPA_ONNX_REF: 7fc2ea7725425d2df7516fdc17e6abe6bd9518d7
  PKG_CONFIG_PATH: ${{ runner.temp }}/sherpa/lib/pkgconfig
  LD_LIBRARY_PATH: ${{ runner.temp }}/sherpa/lib

jobs:
  # The pure-logic gate. No sherpa-onnx, no bindgen, no native library: this is
  # what must pass on any contributor machine and is the fastest signal that
  # model discovery, wire decoding, and availability policy are intact.
  pure:
    name: Pure logic (no native library)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Format
        run: cargo fmt -- --check

      - name: Test without the native backend
        run: cargo test --no-default-features

      - name: Lint without the native backend
        run: cargo clippy --no-default-features --all-targets -- -D warnings

  # The shipped configuration: links the pinned sherpa-onnx C API and proves the
  # engine actually transcribes through Typio's black-box conformance gate.
  native:
    name: Native build against pinned sherpa-onnx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev

      - name: Checkout Typio
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/typio
          path: _typio

      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: ${{ env.SHERPA_ONNX_REF }}
          path: _sherpa_onnx

      - name: Build and install the sherpa-onnx C API
        run: |
          cmake -S _sherpa_onnx -B _sherpa_onnx/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/sherpa" \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_C_API=ON \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_ENABLE_TESTS=OFF \
            -DSHERPA_ONNX_ENABLE_CHECK=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_TTS=OFF \
            -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF \
            -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF
          cmake --build _sherpa_onnx/build --target install --parallel 2

      - name: Build the engine
        run: cargo build --release

      - name: Lint the shipped configuration
        run: cargo clippy --all-targets -- -D warnings

      # The recorded defect was a green conformance gate over a stub. The gate is
      # black-box and lives in the host repo, so it is the authority here.
      - name: Build the conformance checker
        run: cargo build --release -p typio-engine-check --manifest-path _typio/Cargo.toml

      - name: Install a model and prove the engine transcribes
        run: |
          ./scripts/install-sensevoice-model.sh -d "${{ runner.temp }}/data/typio/sherpa-onnx"
          XDG_DATA_HOME="${{ runner.temp }}/data" \
            ./_typio/target/release/typio-engine-check ./typio-engine-sherpa.toml \
              --only protocol,behavior

  install-layout:
    name: Installed layout
    runs-on: ubuntu-24.04
    needs: native
    steps:
      - uses: actions/checkout@v4

      - name: Check the packaged resources exist
        run: |
          test -f typio-engine-sherpa.toml
          test -f data/icons/hicolor/scalable/apps/typio-sherpa-symbolic.svg
          # The manifest must point at a Cargo-built binary, not a meson target.
          grep -q '^command = "./target/release/typio-engine-sherpa"$' typio-engine-sherpa.toml
